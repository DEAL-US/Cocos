# Para desarrollo

services:
  postgres:
    image: postgres:16-alpine
    container_name: bio-web-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cocos}
      POSTGRES_USER: ${POSTGRES_USER:-cocos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cocos_database_password}
    volumes:
      - postgres_data_web:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cocos} -d ${POSTGRES_DB:-cocos}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      bio-network:
        aliases:
          - bio-web-postgres

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # El CSS y las librerías JS los genera el servicio frontend en la carpeta montada
    command: >
      sh -c "python manage.py migrate --noinput &&
            python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ../app:/app
    # Ejecutar con UID 1000 - No arrancar como root
    user: "1000:1000"
    ports:
      - "8080:8000"
    env_file:
      - ../.env
    environment:
      DB_HOST: bio-web-postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bio-network

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: sh -c "export PYTHONPATH=/app && celery -A app worker -l info"
    volumes:
      - ../app:/app
    # Ejecutar con UID 1000 - No arrancar como root
    user: "1000:1000"
    env_file:
      - ../.env
    environment:
      DB_HOST: bio-web-postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bio-network

  # Genera en la carpeta montada el CSS (Tailwind) y las librerías JS (static/vendor/) y vuelve a
  # compilar el CSS cuando una plantilla, un .py o un .js es más nuevo que él. Lo comprueba cada 2 s
  # porque Docker en Windows no avisa de los cambios de las carpetas montadas (tailwindcss --watch
  # no los vería). node_modules va en un volumen: el de la máquina trae binarios de Windows.
  frontend:
    image: node:20-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - |
        npm ci --no-audit --no-fund && npm run build || exit 1
        while true; do
          if [ -n "$$(find templates static/js static_src -type f -newer static/css/tailwind.css | head -n 1)" ] ||
             [ -n "$$(find . \( -path ./node_modules -o -path ./media -o -path ./uploads \) -prune -o -name '*.py' -newer static/css/tailwind.css -print | head -n 1)" ]; then
            npm run build:css
          fi
          sleep 2
        done
    volumes:
      - ../app:/app
      - frontend_node_modules:/app/node_modules

  redis:
    image: redis:7-alpine
    container_name: bio-web-redis
    volumes:
      - redis_data_web:/data
    networks:
      bio-network:
        aliases:
          - bio-web-redis

networks:
  bio-network:
    external: true
    name: bio-network

volumes:
  postgres_data_web:
  redis_data_web:
  frontend_node_modules:
